      // Register Service Worker - intercepts ALL Firestore requests at network level
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js?v=20260612140300', { scope: '/' })
          .then(function(reg) {
            console.log('[SICIP] Service Worker registered:', reg.scope);
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'activated') {
                  console.log('[SICIP] New Service Worker activated');
                }
              });
            });
          })
          .catch(function(err) {
            console.error('[SICIP] Service Worker registration failed:', err);
          });
      }
