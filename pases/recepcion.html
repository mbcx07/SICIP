<!DOCTYPE html><html lang="es-MX"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SICIP — Recepción de Pases</title><style>:root{--imss:#005235;--bg:#f4f7f5;--line:#dbe5df}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#1f2937}.wrap{max-width:820px;margin:0 auto;padding:22px}.hero,.card{border-radius:18px}.hero{background:linear-gradient(135deg,#005235,#0b6b43);color:white;padding:22px}.card{background:white;border:1px solid var(--line);padding:18px;margin-top:18px;box-shadow:0 8px 18px rgba(15,23,42,.06)}label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px;text-transform:uppercase}input{width:100%;border:1px solid #cfd8d3;border-radius:12px;padding:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;background:var(--imss);color:white}.btn.secondary{background:#eef4f0;color:var(--imss);border:1px solid #cfe0d6}.alert{padding:12px;border-radius:14px;margin:12px 0;font-weight:700}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:8px;text-align:left}.small{font-size:12px;color:#6b7280}</style></head><body><div class="wrap"><section class="hero"><h1>📥 Recepción de Pases</h1><p>Uso exclusivo de Personal. Aquí se reciben pases por folio o QR.</p></section><section class="card"><label>Folio o token QR</label><input id="folio" placeholder="Ej. PASE-20260612-0001 o QR-..."><p class="small">El trabajador no puede recibirse a sí mismo; esta acción corresponde al módulo de Recepciones.</p><button class="btn" id="btn">Marcar recibido por Personal</button><a class="btn secondary" href="index.html" style="display:inline-block;text-decoration:none;margin-left:8px">Volver a generación</a><div id="msg"></div></section><section class="card"><h2>Últimos pases</h2><table class="tbl"><thead><tr><th>Folio</th><th>Trabajador</th><th>Estado</th></tr></thead><tbody id="tbody"></tbody></table></section></div><script>(function(){var STORE='sicip_pases_v1';var $=id=>document.getElementById(id);function load(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){return[]}}function save(a){localStorage.setItem(STORE,JSON.stringify(a))}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){var a=load().slice().reverse();$('tbody').innerHTML=a.map(p=>'<tr><td><b>'+esc(p.folio)+'</b><br><span class="small">'+esc(p.qrToken)+'</span></td><td>'+esc(p.nombre)+'<br><span class="small">'+esc(p.matricula)+'</span></td><td>'+esc((p.estado||'').replace('_',' '))+'</td></tr>').join('')||'<tr><td colspan="3">Sin pases.</td></tr>'}$('btn').onclick=function(){var f=$('folio').value.trim();var a=load(),ok=false;a.forEach(function(p){if(p.folio===f||p.qrToken===f){p.estado='RECIBIDO_PERSONAL';p.fechaRecepcionPersonal=new Date().toISOString();ok=true}});save(a);$('msg').innerHTML=ok?'<div class="alert green">Pase recibido por Personal.</div>':'<div class="alert red">Folio/QR no encontrado.</div>';render()};render()})();</script></body></html>
